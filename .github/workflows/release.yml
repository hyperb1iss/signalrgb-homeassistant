name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish validated release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
      - name: Verify tag and package versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run --no-project scripts/release.py verify "$RELEASE_TAG"
      - run: uv build
      - name: Package HACS integration
        working-directory: custom_components/signalrgb
        run: zip -r ../../dist/signalrgb.zip . -x '*.pyc' '*/__pycache__/*'
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/signalrgb.zip
            dist/*.whl
            dist/*.tar.gz
